<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MAX</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g'><stop offset='0' stop-color='%237C4DFF'/><stop offset='1' stop-color='%234A90E2'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(%23g)'/></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0A0A0F; --bg-side: #12121A; --bg-hover: #1A1A24; --bg-active: #22222E;
  --bg-input: #1A1A24; --bg-bubble-in: #1E1E2A;
  --bg-bubble-out: linear-gradient(135deg, #7C4DFF, #4A90E2);
  --text: #FFFFFF; --text-dim: #8E8EA0; --text-soft: #5A5A6E;
  --border: #24243A; --divider: #1A1A28;
  --accent: #7C4DFF; --accent2: #4A90E2;
  --gradient: linear-gradient(135deg, #7C4DFF, #4A90E2);
  --online: #34C759; --danger: #FF3B30;
  --font-size: 15px;
}
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; background: #000; color: var(--text); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
.app-container { position: relative; width: 100%; max-width: 480px; height: 100vh; height: 100dvh; margin: 0 auto; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
.hidden { display: none !important; }

#loginScreen { position: fixed; inset: 0; z-index: 1000; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-inner { max-width: 400px; width: 100%; text-align: center; }
.login-logo { width: 96px; height: 96px; margin: 0 auto 24px; border-radius: 26px; background: var(--gradient); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 40px rgba(124, 77, 255, 0.4); }
.login-logo svg { width: 56px; height: 56px; }
.login-inner h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
.login-inner p { color: var(--text-dim); font-size: 15px; margin-bottom: 40px; }
.google-btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 14px 22px; background: #fff; border: none; border-radius: 14px; cursor: pointer; font-size: 15px; font-weight: 600; color: #1F2027; font-family: inherit; transition: all 0.15s; width: 100%; }
.google-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(255,255,255,0.15); }
.google-btn svg { width: 20px; height: 20px; }

.app-header { display: flex; align-items: center; padding: 14px 16px 10px; gap: 12px; background: var(--bg); flex-shrink: 0; }
.header-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; flex: 1; }
.header-btn { width: 40px; height: 40px; border-radius: 50%; background: transparent; border: none; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; flex-shrink: 0; }
.header-btn:hover { background: var(--bg-hover); }
.header-btn svg { width: 22px; height: 22px; }
.header-btn.accent { color: var(--accent); }

.content { flex: 1; overflow-y: auto; overflow-x: hidden; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.search-wrap { padding: 4px 16px 12px; }
.search-input { width: 100%; padding: 10px 16px; background: var(--bg-input); border: none; border-radius: 20px; color: var(--text); font-family: inherit; font-size: 15px; outline: none; }
.search-input::placeholder { color: var(--text-soft); }

.chat-list { padding-bottom: 20px; }
.chat-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; transition: background 0.15s; }
.chat-row:hover { background: var(--bg-hover); }

.avatar { width: 54px; height: 54px; border-radius: 50%; background: var(--bg-side); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; position: relative; overflow: hidden; font-weight: 600; color: #fff; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.grad1 { background: linear-gradient(135deg, #7C4DFF, #4A90E2); }
.avatar.grad2 { background: linear-gradient(135deg, #F093FB, #F5576C); }
.avatar.grad3 { background: linear-gradient(135deg, #4FACFE, #00F2FE); }
.avatar.grad4 { background: linear-gradient(135deg, #FA709A, #FEE140); }
.avatar.grad5 { background: linear-gradient(135deg, #30CFD0, #330867); }
.avatar.grad6 { background: linear-gradient(135deg, #A8EDEA, #FED6E3); color: #333; }
.avatar .online-dot { position: absolute; bottom: 2px; right: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--online); border: 2.5px solid var(--bg); }
.avatar .type-badge { position: absolute; bottom: -1px; right: -1px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg-side); border: 2px solid var(--bg); display: flex; align-items: center; justify-content: center; color: var(--accent); }
.avatar .type-badge svg { width: 11px; height: 11px; }

.chat-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.chat-info-top { display: flex; align-items: center; gap: 8px; }
.chat-name { font-size: 15.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; display: flex; align-items: center; gap: 6px; }
.chat-name .verified svg { width: 14px; height: 14px; color: var(--accent); }
.chat-time { font-size: 12px; color: var(--text-dim); flex-shrink: 0; }
.chat-info-bottom { display: flex; align-items: center; gap: 8px; }
.chat-preview { font-size: 14px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--gradient); color: #fff; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

.contact-section-title { padding: 14px 16px 6px; font-size: 12px; font-weight: 600; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.5px; }
.contact-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; }
.contact-row:hover { background: var(--bg-hover); }
.contact-row .avatar { width: 44px; height: 44px; font-size: 18px; }
.contact-info { flex: 1; min-width: 0; }
.contact-name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.contact-status { font-size: 13px; color: var(--text-dim); }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 60px 40px; min-height: 40vh; color: var(--text-dim); }
.empty-state .empty-icon { width: 72px; height: 72px; border-radius: 50%; background: var(--bg-side); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; color: var(--text-soft); }
.empty-state .empty-icon svg { width: 34px; height: 34px; }
.empty-state h3 { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.empty-state p { font-size: 14px; max-width: 300px; }

.settings-profile { display: flex; align-items: center; gap: 14px; padding: 20px 16px; }
.settings-profile .avatar { width: 68px; height: 68px; font-size: 26px; }
.settings-profile-info { flex: 1; min-width: 0; }
.settings-profile-name { font-size: 19px; font-weight: 600; }
.settings-profile-email { font-size: 13.5px; color: var(--text-dim); margin-top: 2px; word-break: break-all; }
.settings-group { margin: 12px 16px; background: var(--bg-side); border-radius: 14px; overflow: hidden; }
.settings-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; cursor: pointer; transition: background 0.15s; border-bottom: 1px solid var(--divider); color: var(--text); background: transparent; border-left: none; border-right: none; border-top: none; width: 100%; text-align: left; font-size: 15px; font-family: inherit; }
.settings-item:last-child { border-bottom: none; }
.settings-item:hover { background: var(--bg-hover); }
.settings-item .icon { width: 32px; height: 32px; border-radius: 10px; background: var(--bg-hover); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--accent); }
.settings-item .icon svg { width: 18px; height: 18px; }
.settings-item .icon.danger { color: var(--danger); }
.settings-item .label { flex: 1; }
.settings-item .value { color: var(--text-dim); font-size: 13.5px; }
.settings-item .chev { color: var(--text-soft); }
.settings-item .chev svg { width: 16px; height: 16px; }
.settings-item.danger .label { color: var(--danger); }

.bottom-nav { display: flex; background: var(--bg-side); border-top: 1px solid var(--divider); padding: 6px 0 max(6px, env(safe-area-inset-bottom)) 0; flex-shrink: 0; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; background: transparent; border: none; cursor: pointer; color: var(--text-soft); font-family: inherit; font-size: 10.5px; position: relative; }
.nav-item svg { width: 24px; height: 24px; }
.nav-item.active { color: var(--accent); }
.nav-item .nav-badge { position: absolute; top: 2px; left: 50%; transform: translateX(6px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--gradient); color: #fff; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; }

.chat-screen { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; transform: translateX(100%); transition: transform 0.25s cubic-bezier(.4,0,.2,1); }
.chat-screen.open { transform: translateX(0); }
.chat-header { display: flex; align-items: center; padding: 10px 12px; gap: 10px; background: var(--bg-side); border-bottom: 1px solid var(--divider); flex-shrink: 0; }
.back-btn { width: 40px; height: 40px; border-radius: 50%; background: transparent; border: none; color: var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.back-btn svg { width: 22px; height: 22px; }
.chat-header-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.chat-header-name { font-size: 15.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
.chat-header-status { font-size: 12.5px; color: var(--text-dim); }
.chat-header .avatar { width: 40px; height: 40px; font-size: 17px; }
.chat-header-btn { width: 40px; height: 40px; border-radius: 50%; background: transparent; border: none; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.chat-header-btn svg { width: 20px; height: 20px; }

.chat-messages { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
.message-row { display: flex; margin-bottom: 2px; }
.message-row.out { justify-content: flex-end; }
.message-bubble { max-width: 78%; padding: 8px 12px 6px; border-radius: 18px; position: relative; word-wrap: break-word; font-size: var(--font-size); line-height: 1.4; animation: msgIn 0.2s ease; }
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.message-row.in .message-bubble { background: var(--bg-bubble-in); border-bottom-left-radius: 6px; }
.message-row.out .message-bubble { background: var(--bg-bubble-out); color: #fff; border-bottom-right-radius: 6px; }
.message-sender { font-size: 12.5px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
.message-meta { display: flex; align-items: center; justify-content: flex-end; gap: 3px; margin-top: 2px; font-size: 11px; opacity: 0.7; }
.message-row.in .message-meta { color: var(--text-dim); opacity: 1; }
.message-row.out .message-meta { color: rgba(255,255,255,0.85); }
.message-photo-wrap { max-width: 78%; border-radius: 16px; overflow: hidden; position: relative; }
.message-photo-wrap img { display: block; max-width: 100%; max-height: 320px; border-radius: 16px; cursor: pointer; }
.message-photo-with-caption { background: var(--bg-bubble-in); padding: 4px; }
.message-photo-with-caption img { border-radius: 12px; }
.message-photo-with-caption .message-caption { padding: 6px 8px 2px; }
.message-photo-with-caption .message-meta { padding: 0 8px 4px; }
.chat-day-sep { text-align: center; margin: 12px 0 8px; font-size: 12px; color: var(--text-dim); }

.chat-input-wrap { padding: 8px 10px max(8px, env(safe-area-inset-bottom)) 10px; background: var(--bg-side); border-top: 1px solid var(--divider); flex-shrink: 0; display: flex; align-items: flex-end; gap: 6px; position: relative; }
.chat-input-btn { width: 42px; height: 42px; border-radius: 50%; background: transparent; border: none; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.chat-input-btn svg { width: 22px; height: 22px; }
#messageInput { flex: 1; background: var(--bg-input); border: none; border-radius: 22px; padding: 10px 16px; color: var(--text); font-family: inherit; font-size: 15px; line-height: 1.4; resize: none; outline: none; max-height: 120px; min-height: 42px; }
#messageInput::placeholder { color: var(--text-soft); }
.send-msg-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--gradient); border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.send-msg-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.send-msg-btn svg { width: 20px; height: 20px; }

.photo-attach-preview { position: absolute; bottom: 100%; left: 0; right: 0; background: var(--bg-side); border-top: 1px solid var(--divider); padding: 12px; display: none; z-index: 10; }
.photo-attach-preview.show { display: block; }
.photo-attach-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 12px; margin-right: 12px; }
.photo-attach-fields { flex: 1; min-width: 0; }
.photo-attach-fields input { width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; color: var(--text); font-family: inherit; font-size: 14px; outline: none; margin-bottom: 6px; }
.photo-attach-actions { display: flex; gap: 6px; }
.photo-attach-actions button { flex: 1; padding: 10px; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border: none; }
.photo-attach-actions .cancel { background: var(--bg-hover); color: var(--text); }
.photo-attach-actions .confirm { background: var(--gradient); color: #fff; }

.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 500; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-backdrop.show { display: flex; }
.modal { background: var(--bg-side); border-radius: 20px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; padding: 22px; }
.modal h2 { font-size: 19px; font-weight: 600; margin-bottom: 18px; }
.modal-input, .modal-textarea { width: 100%; padding: 12px 16px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-family: inherit; font-size: 15px; outline: none; margin-bottom: 12px; }
.modal-input:focus, .modal-textarea:focus { border-color: var(--accent); }
.modal-textarea { resize: none; min-height: 70px; }
.modal-label { font-size: 13px; color: var(--text-dim); margin-bottom: 6px; display: block; }
.modal-actions { display: flex; gap: 8px; margin-top: 8px; }
.modal-btn { flex: 1; padding: 12px; border-radius: 12px; font-family: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer; border: none; }
.modal-btn.cancel { background: var(--bg-hover); color: var(--text); }
.modal-btn.confirm { background: var(--gradient); color: #fff; }

.user-search-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; cursor: pointer; transition: background 0.15s; }
.user-search-item:hover { background: var(--bg-hover); }
.user-search-item .avatar { width: 44px; height: 44px; font-size: 18px; }
.user-search-item .info { flex: 1; min-width: 0; }
.user-search-item .name { font-size: 15px; font-weight: 500; }
.user-search-item .username { font-size: 13px; color: var(--text-dim); }

.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg-side); color: var(--text); padding: 11px 20px; border-radius: 12px; font-size: 13.5px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: all 0.25s; z-index: 1000; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.photo-preview { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1100; display: none; align-items: center; justify-content: center; padding: 20px; cursor: pointer; }
.photo-preview.show { display: flex; }
.photo-preview img { max-width: 100%; max-height: 100%; border-radius: 12px; }

.loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-inner">
    <div class="login-logo"><svg viewBox="0 0 100 100" fill="white"><path d="M25 35 Q25 25 35 25 L65 25 Q75 25 75 35 L75 60 Q75 70 65 70 L50 70 L40 80 L40 70 Q25 70 25 60 Z"/></svg></div>
    <h1>MAX</h1>
    <p>Общение без лишнего</p>
    <button class="google-btn" onclick="signInGoogle()">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Войти через Google
    </button>
  </div>
</div>

<!-- APP -->
<div class="app-container hidden" id="appContainer">
  <div class="app-header">
    <div class="header-title" id="headerTitle">Чаты</div>
    <button class="header-btn accent" onclick="headerAction()" id="headerActionBtn" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    </button>
  </div>

  <div class="content">
    <div class="tab-panel active" id="panelChats">
      <div class="search-wrap"><input type="text" class="search-input" id="searchChats" placeholder="Поиск чатов" oninput="renderChats()"></div>
      <div class="chat-list" id="chatList"></div>
    </div>

    <div class="tab-panel" id="panelContacts">
      <div class="search-wrap"><input type="text" class="search-input" id="searchUsers" placeholder="Найти по @юзернейму или имени" oninput="searchUsers()"></div>
      <div id="usersList"></div>
    </div>

    <div class="tab-panel" id="panelCalls">
      <div class="empty-state">
        <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
        <h3>Звонки</h3>
        <p>Скоро здесь появятся звонки</p>
      </div>
    </div>

    <div class="tab-panel" id="panelSettings">
      <div class="settings-profile">
        <div class="avatar grad1" id="myAvatar">?</div>
        <div class="settings-profile-info">
          <div class="settings-profile-name" id="myName">Пользователь</div>
          <div class="settings-profile-email" id="myUsername">@</div>
        </div>
      </div>

      <div class="settings-group">
        <button class="settings-item" onclick="openEditName()">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
          <div class="label">Имя профиля</div>
          <div class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
        </button>
        <button class="settings-item" onclick="openEditUsername()">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/></svg></div>
          <div class="label">Юзернейм</div>
          <div class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
        </button>

<script>
/* ═══════════════════════════════════════════════════════════
   КОНФИГ SUPABASE
   ═══════════════════════════════════════════════════════════ */
const SUPABASE_URL = "https://nfqgwezkfbybywhqvloe.supabase.co";
const SUPABASE_KEY = "sb_publishable_bL_dsu-E4xaXREwJiDfN3w_hI3VS4P7";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true }
});

/* ═══════════════ СОСТОЯНИЕ ═══════════════ */
let currentUser = null;
let myProfile = null;
let chats = [];
let messages = [];
let currentChatId = null;
let currentTab = "chats";
let currentChannel = null;
let pendingPhoto = null;
let createType = "channel";
let searchTimeout = null;

/* ═══════════════ AUTH ═══════════════ */
async function signInGoogle() {
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname }
  });
  if (error) { toast("Ошибка входа: " + error.message); return; }
}

async function logout() {
  if (!confirm("Выйти из аккаунта?")) return;
  if (currentChannel) { sb.removeChannel(currentChannel); currentChannel = null; }
  await sb.auth.signOut();
  location.reload();
}

async function checkAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { showLogin(); return false; }
  currentUser = session.user;
  // Загружаем профиль
  const { data, error } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  if (error || !data) {
    // Профиль создаётся триггером, но на всякий случай создаём сами
    await sb.from('profiles').insert({
      id: currentUser.id,
      display_name: currentUser.user_metadata?.full_name || currentUser.email?.split('@')[0],
      avatar_url: currentUser.user_metadata?.avatar_url
    });
    const r = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
    myProfile = r.data;
  } else {
    myProfile = data;
  }
  return true;
}

function showLogin() {
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("appContainer").classList.add("hidden");
}
function showApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("appContainer").classList.remove("hidden");
}

/* ═══════════════ UI HELPERS ═══════════════ */
function escapeHtml(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
let toastTimer;
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2000); }
function openModal(id) { document.getElementById(id).classList.add("show"); }
function closeModal(id) { document.getElementById(id).classList.remove("show"); }

function formatTime(ts) {
  const d = new Date(ts), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString("ru", { hour: "2-digit", minute: "2-digit" });
  const dd = Math.floor((now.setHours(0,0,0,0) - new Date(d).setHours(0,0,0,0)) / 86400000);
  if (dd === 1) return "вчера";
  if (dd < 7) return d.toLocaleDateString("ru", { weekday: "short" });
  return d.toLocaleDateString("ru", { day: "numeric", month: "numeric" });
}
function dayLabel(ts) {
  const d = new Date(ts), now = new Date();
  const dd = Math.floor((now.setHours(0,0,0,0) - new Date(d).setHours(0,0,0,0)) / 86400000);
  if (dd === 0) return "Сегодня";
  if (dd === 1) return "Вчера";
  return d.toLocaleDateString("ru", { day: "numeric", month: "long" });
}

/* ═══════════════ PROFILE ═══════════════ */
function renderProfile() {
  const av = document.getElementById("myAvatar");
  const name = myProfile.display_name || "Пользователь";
  const username = myProfile.username ? "@" + myProfile.username : "Юзернейм не задан";
  document.getElementById("myName").textContent = name;
  document.getElementById("myUsername").textContent = username;

  if (myProfile.avatar_url) {
    av.innerHTML = `<img src="${myProfile.avatar_url}" alt="">`;
  } else {
    const grads = ["grad1","grad2","grad3","grad4","grad5","grad6"];
    const idx = (myProfile.id.charCodeAt(0) || 0) % 6;
    av.className = "avatar " + grads[idx];
    av.textContent = name[0].toUpperCase();
  }
}

function openEditName() {
  document.getElementById("inputName").value = myProfile.display_name || "";
  openModal("modalName");
}
async function saveName() {
  const v = document.getElementById("inputName").value.trim();
  if (!v) return;
  const { error } = await sb.from('profiles').update({ display_name: v }).eq('id', currentUser.id);
  if (error) { toast("Ошибка: " + error.message); return; }
  myProfile.display_name = v;
  renderProfile();
  closeModal("modalName");
  toast("Имя сохранено");
}

function openEditUsername() {
  document.getElementById("inputUsername").value = myProfile.username || "";
  openModal("modalUsername");
}
async function saveUsername() {
  let v = document.getElementById("inputUsername").value.trim().replace(/^@/, '').toLowerCase();
  if (!/^[a-z0-9_]{3,20}$/.test(v)) { toast("Только a-z, 0-9, _ (3-20)"); return; }
  const { error } = await sb.from('profiles').update({ username: v }).eq('id', currentUser.id);
  if (error) {
    if (error.code === '23505') toast("Юзернейм занят");
    else toast("Ошибка: " + error.message);
    return;
  }
  myProfile.username = v;
  renderProfile();
  closeModal("modalUsername");
  toast("Юзернейм сохранён");
}

/* ═══════════════ TABS ═══════════════ */
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  document.getElementById("panel" + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add("active");
  document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.tab === tab));
  const titles = { chats: "Чаты", contacts: "Поиск", calls: "Звонки", settings: "Ещё" };
  document.getElementById("headerTitle").textContent = titles[tab];
  const btn = document.getElementById("headerActionBtn");
  btn.style.display = (tab === "chats") ? "flex" : "none";
  if (tab === "contacts") {
    document.getElementById("searchUsers").focus();
  }
}
function headerAction() {
  if (currentTab === "chats") openCreateModal("channel");
}

/* ═══════════════ CHATS ═══════════════ */
async function loadChats() {
  // Получаем чаты, где я участник
  const { data: myMemberships, error: memErr } = await sb
    .from('chat_members')
    .select('chat_id')
    .eq('user_id', currentUser.id);

  if (memErr) { toast("Ошибка: " + memErr.message); return; }
  if (!myMemberships || !myMemberships.length) { chats = []; renderChats(); return; }

  const chatIds = myMemberships.map(m => m.chat_id);

  const { data, error } = await sb
    .from('chats')
    .select('*')
    .in('id', chatIds);

  if (error) { toast("Ошибка: " + error.message); return; }
  chats = data || [];
  renderChats();
}

function getChatDisplayName(chat) {
  if (chat.type === 'dm') {
    // Для DM — имя собеседника (нужно подгрузить позже)
    return chat._dmPartnerName || "Личный чат";
  }
  return chat.name || "Без названия";
}

async function enrichDMs() {
  // Для DM-чатов узнаём имя собеседника
  for (const chat of chats) {
    if (chat.type !== 'dm') continue;
    const { data: members } = await sb
      .from('chat_members')
      .select('user_id')
      .eq('chat_id', chat.id);
    const other = (members || []).find(m => m.user_id !== currentUser.id);
    if (!other) { chat._dmPartnerName = "Удалённый пользователь"; continue; }
    const { data: prof } = await sb.from('profiles').select('*').eq('id', other.user_id).single();
    chat._dmPartnerName = prof?.display_name || prof?.username || "Пользователь";
    chat._dmPartnerProfile = prof;
  }
}

function renderChats() {
  const list = document.getElementById("chatList");
  const q = (document.getElementById("searchChats").value || "").toLowerCase().trim();
  let filtered = chats.slice();
  if (q) filtered = filtered.filter(c => getChatDisplayName(c).toLowerCase().includes(q));

  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><h3>Нет чатов</h3><p>Начни переписку — найди пользователя по @юзернейму</p></div>`;
    return;
  }

  list.innerHTML = "";
  filtered.forEach(chat => {
    const name = getChatDisplayName(chat);
    const el = document.createElement("div");
    el.className = "chat-row";
    el.onclick = () => openChat(chat.id);

    const av = document.createElement("div");
    av.className = "avatar " + (chat.grad || "grad1");
    if (chat.avatar_url) av.innerHTML = `<img src="${chat.avatar_url}" alt="">`;
    else if (chat.type === 'dm' && chat._dmPartnerProfile?.avatar_url) av.innerHTML = `<img src="${chat._dmPartnerProfile.avatar_url}" alt="">`;
    else av.textContent = name[0].toUpperCase();

    if (chat.type === 'channel' || chat.type === 'group') {
      const tb = document.createElement("div"); tb.className = "type-badge";
      tb.innerHTML = chat.type === 'channel'
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>';
      av.appendChild(tb);
    }

    const info = document.createElement("div");
    info.className = "chat-info";
    const top = document.createElement("div"); top.className = "chat-info-top";
    const nm = document.createElement("div"); nm.className = "chat-name"; nm.textContent = name;
    if (chat.type === 'channel') nm.innerHTML += '<span class="verified"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 5.2L20 8l-4 4 1 6-5-3-5 3 1-6-4-4 5.6-.8z"/></svg></span>';
    top.appendChild(nm);
    info.appendChild(top);

    const bot = document.createElement("div"); bot.className = "chat-info-bottom";
    const preview = document.createElement("div"); preview.className = "chat-preview";
    preview.textContent = chat.type === 'dm' ? 'Личный чат' : (chat.description || (chat.type === 'channel' ? 'Канал' : 'Группа'));
    bot.appendChild(preview);
    info.appendChild(bot);

    el.appendChild(av); el.appendChild(info);
    list.appendChild(el);
  });
}

/* ═══════════════ USER SEARCH ═══════════════ */
function searchUsers() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(async () => {
    const q = document.getElementById("searchUsers").value.trim();
    const list = document.getElementById("usersList");
    if (!q) {
      list.innerHTML = `<div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><h3>Найди друзей</h3><p>Введи @юзернейм или имя</p></div>`;
      return;
    }

    const { data, error } = await sb.rpc('find_user', { search: q });
    if (error) { toast("Ошибка поиска"); return; }

    const users = (data || []).filter(u => u.id !== currentUser.id);
    if (!users.length) {
      list.innerHTML = `<div class="empty-state"><p>Никого не найдено</p></div>`;
      return;
    }

    list.innerHTML = "";
    users.forEach(u => {
      const el = document.createElement("div");
      el.className = "user-search-item";
      el.onclick = () => startChatWith(u.id);

      const av = document.createElement("div");
      av.className = "avatar grad2";
      if (u.avatar_url) av.innerHTML = `<img src="${u.avatar_url}" alt="">`;
      else av.textContent = (u.display_name || u.username || "?")[0].toUpperCase();

      const info = document.createElement("div");
      info.className = "info";
      info.innerHTML = `<div class="name">${escapeHtml(u.display_name || "Пользователь")}</div>
        <div class="username">${u.username ? "@" + escapeHtml(u.username) : "без @юзернейма"}</div>`;

      el.appendChild(av); el.appendChild(info);
      list.appendChild(el);
    });
  }, 300);
}

async function startChatWith(userId) {
  const { data: chatId, error } = await sb.rpc('get_or_create_dm', { other_user: userId });
  if (error) { toast("Ошибка: " + error.message); return; }
  await loadChats();
  await enrichDMs();
  renderChats();
  switchTab('chats');
  openChat(chatId);
}

/* ═══════════════ OPEN CHAT ═══════════════ */
async function openChat(chatId) {
  currentChatId = chatId;
  const chat = chats.find(c => c.id === chatId);
  if (!chat) return;

  const name = getChatDisplayName(chat);
  document.getElementById("chatName").textContent = name;
  document.getElementById("chatStatus").textContent = chat.type === 'channel' ? 'Канал' : chat.type === 'group' ? 'Группа' : '';
  const av = document.getElementById("chatAvatar");
  av.className = "avatar " + (chat.grad || "grad1");
  if (chat.avatar_url) av.innerHTML = `<img src="${chat.avatar_url}" alt="">`;
  else if (chat.type === 'dm' && chat._dmPartnerProfile?.avatar_url) av.innerHTML = `<img src="${chat._dmPartnerProfile.avatar_url}" alt="">`;
  else av.textContent = name[0].toUpperCase();

  await loadMessages(chatId);
  subscribeToMessages(chatId);

  document.getElementById("chatScreen").classList.add("open");
  document.body.style.overflow = "hidden";
  setTimeout(() => { scrollMessagesToBottom(false); document.getElementById("messageInput").focus(); }, 100);
}

function closeChat() {
  if (currentChannel) { sb.removeChannel(currentChannel); currentChannel = null; }
  document.getElementById("chatScreen").classList.remove("open");
  document.body.style.overflow = "";
  currentChatId = null;
  cancelPhotoAttach();
}

/* ═══════════════ MESSAGES ═══════════════ */
async function loadMessages(chatId) {
  const { data, error } = await sb
    .from('messages')
    .select('*')
    .eq('chat_id', chatId)
    .order('created_at', { ascending: true })
    .limit(200);

  if (error) { toast("Ошибка загрузки"); return; }
  messages = data || [];

  // Подгрузим профили отправителей для отображения имён
  const senderIds = [...new Set(messages.map(m => m.sender_id).filter(Boolean))];
  if (senderIds.length) {
    const { data: profiles } = await sb.from('profiles').select('id, display_name, username, avatar_url').in('id', senderIds);
    window._profilesCache = {};
    (profiles || []).forEach(p => window._profilesCache[p.id] = p);
  }

  renderMessages();
}

function subscribeToMessages(chatId) {
  if (currentChannel) { sb.removeChannel(currentChannel); currentChannel = null; }
  currentChannel = sb.channel('chat_' + chatId)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'messages', filter: `chat_id=eq.${chatId}` },
      async (payload) => {
        const msg = payload.new;
        if (messages.find(m => m.id === msg.id)) return;
        // Подгружаем профиль отправителя если его нет
        if (msg.sender_id && (!window._profilesCache || !window._profilesCache[msg.sender_id])) {
          const { data: prof } = await sb.from('profiles').select('id, display_name, username, avatar_url').eq('id', msg.sender_id).single();
          if (prof) { window._profilesCache = window._profilesCache || {}; window._profilesCache[prof.id] = prof; }
        }
        messages.push(msg);
        renderMessages();
        scrollMessagesToBottom(true);
      }
    )
    .subscribe();
}

function renderMessages() {
  const container = document.getElementById("chatMessages");
  container.innerHTML = "";
  if (!messages.length) {
    container.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--text-dim);font-size:14px;">Нет сообщений. Напишите первым!</div>`;
    return;
  }
  const chat = chats.find(c => c.id === currentChatId);
  const isGroup = chat && (chat.type === 'group' || chat.type === 'channel');
  let lastDay = null;
  messages.forEach(m => {
    const day = dayLabel(m.created_at);
    if (day !== lastDay) {
      const sep = document.createElement("div"); sep.className = "chat-day-sep"; sep.textContent = day;
      container.appendChild(sep); lastDay = day;
    }
    container.appendChild(buildMessageEl(m, isGroup));
  });
}

function buildMessageEl(m, isGroup) {
  const isOut = m.sender_id === currentUser.id;
  const row = document.createElement("div");
  row.className = "message-row " + (isOut ? "out" : "in");

  if (m.image_url && m.content) {
    const wrap = document.createElement("div");
    wrap.className = "message-photo-wrap message-photo-with-caption";
    const img = document.createElement("img"); img.src = m.image_url; img.onclick = () => showPhoto(m.image_url);
    const cap = document.createElement("div"); cap.style.cssText = "padding:6px 8px 0;font-size:var(--font-size);";
    cap.innerHTML = escapeHtml(m.content).replace(/\n/g, "<br>");
    const meta = document.createElement("div"); meta.className = "message-meta"; meta.style.cssText = "padding:0 8px 4px;";
    meta.innerHTML = `<span>${formatTime(m.created_at)}</span>`;
    wrap.appendChild(img); wrap.appendChild(cap); wrap.appendChild(meta);
    row.appendChild(wrap);
    return row;
  }
  if (m.image_url) {
    const wrap = document.createElement("div");
    wrap.className = "message-photo-wrap";
    const img = document.createElement("img"); img.src = m.image_url; img.onclick = () => showPhoto(m.image_url);
    wrap.appendChild(img);
    row.appendChild(wrap);
    return row;
  }

  const bubble = document.createElement("div");
  bubble.className = "message-bubble";
  let html = "";
  if (!isOut && isGroup && m.sender_id) {
    const prof = (window._profilesCache || {})[m.sender_id];
    const senderName = prof?.display_name || prof?.username || "Пользователь";
    html += `<div class="message-sender">${escapeHtml(senderName)}</div>`;
  }
  html += escapeHtml(m.content).replace(/\n/g, "<br>");
  bubble.innerHTML = html;
  const meta = document.createElement("div");
  meta.className = "message-meta";
  meta.innerHTML = `<span>${formatTime(m.created_at)}</span>`;
  bubble.appendChild(meta);
  row.appendChild(bubble);
  return row;
}

function onMsgInput() {
  const i = document.getElementById("messageInput");
  i.style.height = "auto"; i.style.height = Math.min(i.scrollHeight, 120) + "px";
  document.getElementById("sendMsgBtn").disabled = !i.value.trim();
}

async function sendMessage() {
  const inp = document.getElementById("messageInput");
  const text = inp.value.trim();
  if (!text || !currentChatId) return;
  inp.value = ""; inp.style.height = "auto";
  document.getElementById("sendMsgBtn").disabled = true;

  const { error } = await sb.from('messages').insert({
    chat_id: currentChatId,
    sender_id: currentUser.id,
    content: text
  });
  if (error) { toast("Ошибка отправки: " + error.message); return; }
}

function scrollMessagesToBottom(s) {
  const el = document.getElementById("chatMessages");
  requestAnimationFrame(() => el.scrollTo({ top: el.scrollHeight, behavior: s ? "smooth" : "auto" }));
}

/* ═══════════════ PHOTO ═══════════════ */
function handleAttach(event) {
  const file = event.target.files[0]; if (!file) return;
  if (!file.type.startsWith("image/")) { toast("Только изображения"); event.target.value = ""; return; }
  if (file.size > 5 * 1024 * 1024) { toast("Максимум 5 МБ"); event.target.value = ""; return; }
  const reader = new FileReader();
  reader.onload = e => {
    pendingPhoto = e.target.result;
    document.getElementById("photoAttachImg").src = e.target.result;
    document.getElementById("photoCaptionInput").value = "";
    document.getElementById("photoAttachPreview").classList.add("show");
  };
  reader.readAsDataURL(file);
  event.target.value = "";
}
function cancelPhotoAttach() {
  pendingPhoto = null;
  document.getElementById("photoAttachPreview").classList.remove("show");
}
async function sendPhoto() {
  if (!pendingPhoto || !currentChatId) return;
  const caption = document.getElementById("photoCaptionInput").value.trim();
  toast("Загрузка фото...");

  // Загружаем в Supabase Storage
  const { data: { session } } = await sb.auth.getSession();
  const fileName = `${currentUser.id}/${Date.now()}.jpg`;
  const blob = await (await fetch(pendingPhoto)).blob();

  const { data, error } = await sb.storage
    .from('chat-photos')
    .upload(fileName, blob, { contentType: 'image/jpeg', upsert: false });

  if (error) { toast("Ошибка загрузки: " + error.message); return; }

  const { data: urlData } = sb.storage.from('chat-photos').getPublicUrl(fileName);

  await sb.from('messages').insert({
    chat_id: currentChatId,
    sender_id: currentUser.id,
    content: caption || null,
    image_url: urlData.publicUrl
  });
  cancelPhotoAttach();
}
function showPhoto(src) {
  document.getElementById("photoPreviewImg").src = src;
  document.getElementById("photoPreview").classList.add("show");
}

/* ═══════════════ CREATE CHANNEL/GROUP ═══════════════ */
function openCreateModal(type) {
  createType = type;
  document.getElementById("createTitle").textContent = type === 'channel' ? "Создать канал" : "Создать группу";
  document.getElementById("createName").value = "";
  document.getElementById("createDesc").value = "";
  openModal("modalCreate");
}

async function createChannelOrGroup() {
  const name = document.getElementById("createName").value.trim();
  if (!name) { toast("Введите название"); return; }
  const desc = document.getElementById("createDesc").value.trim();

  const { data: chat, error } = await sb.from('chats').insert({
    type: createType,
    name: name,
    description: desc,
    owner_id: currentUser.id,
    grad: 'grad1'
  }).select().single();

  if (error) { toast("Ошибка: " + error.message); return; }

  // Добавляем себя в участники
  const { error: memErr } = await sb.from('chat_members').insert({
    chat_id: chat.id,
    user_id: currentUser.id
  });
  if (memErr) { toast("Ошибка: " + memErr.message); return; }

  closeModal("modalCreate");
  await loadChats();
  await enrichDMs();
  renderChats();
  switchTab('chats');
  openChat(chat.id);
  toast("Создано");
}

/* ═══════════════ MODAL HELPERS ═══════════════ */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (document.getElementById("photoAttachPreview").classList.contains("show")) { cancelPhotoAttach(); return; }
    if (document.getElementById("chatScreen").classList.contains("open")) closeChat();
    document.querySelectorAll(".modal-backdrop.show").forEach(m => m.classList.remove("show"));
    document.getElementById("photoPreview").classList.remove("show");
  }
});
document.getElementById("messageInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

/* ═══════════════ INIT ═══════════════ */
(async () => {
  const ok = await checkAuth();
  if (ok) {
    showApp();
    renderProfile();
    await loadChats();
    await enrichDMs();
    renderChats();
    // Слушаем изменения авторизации
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') location.reload();
    });
  }
})();
</script>
